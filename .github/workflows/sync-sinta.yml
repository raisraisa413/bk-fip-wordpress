name: Sync SINTA Kemdiktisaintek

on:
  schedule:
    # Setiap Minggu pukul 02:00 WITA (Sabtu 18:00 UTC)
    - cron: '0 18 * * 6'
  workflow_dispatch:
    inputs:
      sinta_id:
        description: 'Opsional: isi SINTA ID tertentu saja (kosongkan untuk semua dosen)'
        required: false
        default: ''

jobs:
  sync-sinta:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run SINTA Sync
        env:
          WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
          BK_SINTA_SYNC_TOKEN: ${{ secrets.BK_SINTA_SYNC_TOKEN }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.sinta_id }}" ]; then
            ARGS="--sinta-id ${{ github.event.inputs.sinta_id }}"
          fi
          python scripts/sync_sinta.py $ARGS
